# Pages CMS configuration (https://pagescms.org/docs/configuration/).
# Only keys documented in the Pages CMS docs (read 2026-11-19) are used; see docs/OWNER-OPERATIONS.md for the list.
# STATUS: NOT yet opened in the real Pages CMS app (needs the owner's GitHub login). See docs/OWNER-REAL-TEST.md.
#
# Every save is a commit. Open the CMS on the branch `content-edits` (branch picker): saves there never touch the
# live site. Pages CMS reads this file per branch, so keep it identical on main and content-edits.

# Keep any value this form does not know about (for example `related` in an article) instead of deleting it.
settings:
  content:
    merge: true

# Pictures you upload go to public/images and are used on the site as /images/<file name>.
media:
  input: public/images
  output: /images
  categories: [image]
  rename: safe

# Repository buttons (they run the workflows in .github/workflows; both need a `payload` input).
actions:
  - name: publish-site
    label: Publish site
    workflow: publish-content.yml
    ref: main
    cancelable: false
    confirm:
      title: Publish your saved edits to the live website?
      message: "Everything is checked first. If a check fails, nothing changes. Have you looked at the preview?"
      button: Publish now
  - name: undo-last-publish
    label: Undo last publish
    workflow: undo-last-publish.yml
    ref: main
    cancelable: false
    confirm:
      title: Undo the most recent publish?
      message: "This puts the live website back to how it was before the last publish."
      button: Undo it

content:
  # ------------------------------------------------------------------ Articles
  - name: articles
    label: Articles
    type: collection
    path: src/content/articles
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, category, status, publishedAt]
      primary: title
      sort: [publishedAt, title]
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "Lead with the words people would search for. About 50 to 65 characters."
      - name: status
        label: Status
        type: select
        required: true
        description: "Draft = never shown on the website. Published = goes live at the next Publish."
        options:
          values:
            - name: draft
              label: Draft (not on the website)
            - name: published
              label: Published
      - name: category
        label: Category
        type: select
        description: "Required to publish."
        options:
          values:
            - name: Creative Corner
              label: Creative Corner
            - name: After Hours
              label: After Hours
            - name: Better Together
              label: Better Together
            - name: The Weekend Edit
              label: The Weekend Edit
            - name: Table for One
              label: Table for One
            - name: A Little Movement
              label: A Little Movement
      - name: format
        label: Kind of story
        type: select
        description: "Required to publish."
        options:
          values:
            - name: starter-guide
              label: Starter guide
            - name: shopping-edit
              label: Shopping edit
            - name: experience-guide
              label: Experience guide
            - name: discovery
              label: Discovery
      - name: featured
        label: Feature on the home page ("Featured experiences")
        type: boolean
        default: false
      - name: description
        label: Search summary
        type: text
        description: "One or two sentences shown in Google and when shared. Required to publish."
      - name: dek
        label: Standfirst (the line under the title)
        type: text
        description: "One or two warm sentences. Required to publish."
      - name: publishedAt
        label: Publish date
        type: date
        options:
          format: yyyy-MM-dd
      - name: updatedAt
        label: Updated on (only when you change facts)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: hero
        label: Top picture
        type: object
        description: "Picture and description are required to publish. Who made it, the licence and the approval are recorded ONCE, in src/content/images.json (one record per picture); the article is matched to it by file name."
        fields:
          - name: image
            label: Picture
            type: image
            description: "Upload it here, or pick one already uploaded. It needs a record in src/content/images.json."
          - name: alt
            label: Description for screen readers (alt text)
            type: string
      - name: picks
        label: Products to show in "Shop this story"
        type: reference
        description: "Only verified products can be picked. An article that points at an unverified product will not publish."
        options:
          collection: products
          multiple: true
          search: "name,brand"
          value: "{id}"
          label: "{name}"
      - name: body
        label: Article text
        type: rich-text
        description: "Write in the normal way. To mention a product inline type {{product:product-id}}; to place a product card type {{pick:product-id}} on its own line. Use the Source tab if the editor changes the curly brackets."
        options:
          format: markdown
          switcher: true

  # ------------------------------------------------------------------ Products
  - name: products
    label: Products
    type: collection
    path: src/content/products
    format: json
    filename: "{id}.json"
    view:
      fields: [name, brand, status, collection]
      primary: name
      sort: [name, status]
      default:
        sort: name
        order: asc
    fields:
      - name: id
        label: Short name for the product (used in links and articles)
        type: string
        required: true
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description: "Lowercase words joined by hyphens, e.g. tombow-mono-permanent. Never change it after creating the product."
      - name: name
        label: Product name
        type: string
        required: true
      - name: brand
        label: Brand
        type: string
        required: true
      - name: asin
        label: Amazon ASIN (10 letters and digits)
        type: string
        required: true
        pattern: "^[A-Z0-9]{10}$"
        description: "Find it on the Amazon page under Product details. Do not paste a web address."
        options:
          minlength: 10
          maxlength: 10
      - name: status
        label: Status
        type: select
        required: true
        description: "Verified needs the evidence fields below (listing checked, available, seller Amazon or brand, affiliate-eligible yes, specs evidence, suitability). Candidate = idea, never shown."
        options:
          values:
            - name: candidate
              label: Candidate (not checked yet, never shown)
            - name: provisional
              label: Provisional (checked, evidence incomplete; shown only while launchMode is preview)
            - name: verified
              label: Verified (all evidence recorded; shown when approved)
            - name: held
              label: Held (paused, never shown)
            - name: discontinued
              label: Discontinued (no longer sold)
      - name: editorialDecision
        label: Editorial decision
        type: select
        description: "Only products that are technically valid AND approved are shown. Hold = valid but paused for quality or suitability."
        options:
          values:
            - name: approve
              label: Approve (may be shown)
            - name: hold
              label: Hold (never shown)
      - name: order
        label: Position in the shop (optional number, lowest first)
        type: number
        description: "Leave empty for the default order. 1, 2, 3 puts products first, in that order."
      - name: statusReason
        label: Reason (required for Held or Discontinued)
        type: text
      - name: replacedBy
        label: Replaced by (optional)
        type: reference
        description: "If this product is discontinued, choose its replacement. Articles then show the replacement automatically."
        options:
          collection: products
          search: "name,brand"
          value: "{id}"
          label: "{name}"
      - name: collection
        label: Shop section
        type: select
        required: true
        options:
          values:
            - name: paper
              label: The Paper Edit (journaling and stationery)
            - name: creative
              label: The Creative Edit (painting, clay and making)
            - name: cozy
              label: The Cozy Edit (slow evenings in)
            - name: hosting
              label: The Hosting Edit (game nights and gatherings)
            - name: sporty
              label: The Sporty Edit (moving a little more)
            - name: little-adventures
              label: The Little Adventures Edit (days out and small trips)
      - name: descriptionOriginal
        label: Short description (your own words, not copied from Amazon)
        type: text
      - name: whyWeLikeIt
        label: Why we picked it
        type: text
      - name: choiceOf
        label: Alternative to (the id of the main product in the same section; leave empty for a main product)
        type: string
      - name: choiceLabel
        label: How the alternative differs
        type: select
        options:
          values:
            - Prettier alternative
            - Budget-friendly alternative
            - Premium alternative
            - Different style
            - Mix-your-own alternative
            - Larger set
      - name: shopTier
        label: Shop position (Start here = beginner essentials, Pretty extras = optional)
        type: select
        options:
          values:
            - name: start
              label: Start here
            - name: extras
              label: Pretty extras
      - name: bestUse
        label: Best-use label (optional, a few words, e.g. "Best for junk journals")
        type: string
      - name: cta
        label: Button wording
        type: select
        description: "Which words go on the button. Never imply you sell the product."
        options:
          values:
            - name: See It on Amazon
              label: See It on Amazon
            - name: Explore This Starter Kit
              label: Explore This Starter Kit
            - name: Shop the Supplies
              label: Shop the Supplies
            - name: See Our Pick
              label: See Our Pick
      - name: limitations
        label: Worth knowing (honest limits)
        type: text
      - name: listingChecked
        label: Amazon listing check
        type: object
        fields:
          - name: checkedOn
            label: Date you checked the listing
            type: date
            default: ""
            options:
              format: yyyy-MM-dd
          - name: variant
            label: Exact variant checked (size, colour, pack)
            type: string
          - name: listingAvailable
            label: Listing available?
            type: select
            options:
              values:
                - name: unverified
                  label: Not checked
                - name: "yes"
                  label: "Yes"
                - name: "no"
                  label: "No"
          - name: sellerType
            label: Who sells it
            type: select
            options:
              values:
                - name: unverified
                  label: Not checked
                - name: amazon
                  label: Amazon
                - name: brand
                  label: The brand or maker
                - name: other
                  label: Another seller
          - name: affiliateLinkEligible
            label: Eligible for affiliate links?
            type: select
            description: "Unknown is allowed only until the product is verified."
            options:
              values:
                - name: unknown
                  label: Unknown
                - name: "yes"
                  label: "Yes"
                - name: "no"
                  label: "No"
      - name: specsEvidence
        label: Specs evidence (short note with the maker or seller web address)
        type: text
      - name: suitability
        label: Who it suits (short)
        type: text
      - name: qualityNote
        label: Quality note (short, from what you saw)
        type: text
      - name: verificationSource
        label: Where you checked it (a note)
        type: text
        description: "Example: Amazon page read on that date; seller Amazon.com; in stock."
      - name: imageStatus
        label: Picture status
        type: select
        description: "Approved only when the picture has an approved product-photo record in src/content/images.json."
        options:
          values:
            - name: none
              label: No picture
            - name: pending
              label: Pending (not shown)
            - name: approved
              label: Approved
      - name: image
        label: Product picture (optional, never from Amazon)
        type: object
        fields:
          - name: file
            label: Picture
            type: image
          - name: alt
            label: Description for screen readers
            type: string

  # ------------------------------------------------------------------ Settings
  - name: settings
    label: Site settings
    type: file
    path: src/content/settings.json
    format: json
    fields:
      - name: siteName
        label: Site name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: siteUrl
        label: Web address (no slash at the end)
        type: string
      - name: contactEmail
        label: Contact email
        type: string
      - name: amazonTrackingEnabled
        label: Switch Amazon affiliate tracking on
        type: boolean
        description: "Leave OFF until your Amazon Associates account is approved and the tracking ID below is yours."
      - name: amazonTrackingId
        label: Amazon tracking ID
        type: string
        description: "Looks like yourname-20. This is the only place it is stored."
      - name: amazonMarketplace
        label: Amazon marketplace
        type: string
        description: "Keep as amazon.com."
      - name: launchMode
        label: Launch mode
        type: select
        description: "Preview: unfinished picture rights or product evidence are warnings. Production: they fail the build. Switch to Production only when ready to launch."
        options:
          values:
            - name: preview
              label: Preview (warnings only)
            - name: production
              label: Production (unfinished items fail the build)
      - name: amazonDisclosure
        label: Amazon disclosure sentence
        type: text
        description: "Use the exact sentence in your Associates agreement. Do not change it unless Amazon changes it."
      - name: ga4MeasurementId
        label: Google Analytics ID (optional)
        type: string
        description: "Looks like G-XXXXXXXXXX. Empty = no analytics."
      - name: searchConsoleVerification
        label: Google Search Console verification code (optional)
        type: string
