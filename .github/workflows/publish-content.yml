# Publish content: merges the `content-edits` branch into `main` so the website goes live.
# Plain-English guide: docs/OWNER-OPERATIONS.md ("Publish").
#
# WHO CAN START IT: only the "Publish site" button in Pages CMS (see .pages.yml) or "Run workflow" on GitHub's
# Actions tab. Both need write access to the repository. It never runs on pushes or pull requests, and it
# refuses to run unless started on `main`.
#
# WHAT IT DOES (all logic is in scripts/publish.sh, which has its own tests): refuses if the edit branch changes
# anything except src/content/ and public/images/; merges on this temporary machine; runs `npm run check`
# (content check, build, link check) on the merged result; ONLY if everything passes, pushes `main` with a merge
# message containing the marker [deploy] (netlify.toml builds production only for that marker). On any failure
# `main` is not changed.
#
# SAFETY: no secrets; the built-in GITHUB_TOKEN with contents:write only; no third-party actions; fixed branch
# names; nothing from the Pages CMS payload is ever used in a command.
# One-time: Settings > Actions > General > Workflow permissions = "Read and write permissions"; no branch
# protection on main that blocks this push. Keep the marker equal to the one in netlify.toml (tested).
name: Publish content

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Sent by the Pages CMS Publish button. Leave empty when running by hand."
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: publish-content
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Get the repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cred="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$cred"
          git -c "http.extraheader=Authorization: Basic $cred" clone --quiet "https://github.com/$REPO.git" repo
          cd repo
          git config --local http.extraheader "Authorization: Basic $cred"
      - name: Publish (guard, merge, check, push)
        working-directory: repo
        run: |
          node -e 'const v=process.versions.node.split(".").map(Number); if (v[0]<20||(v[0]===20&&v[1]<3)) { console.error("::error::The build machine has Node "+process.versions.node+"; this site needs 20.3 or newer."); process.exit(1) }'
          bash scripts/publish.sh
      - name: Summary
        if: success()
        run: echo "### Publish finished. If edits were merged, Netlify now makes one production deploy (a minute or two)." >> "$GITHUB_STEP_SUMMARY"
